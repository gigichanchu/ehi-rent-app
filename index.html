<style>
/* Layout: one-column ledger. Sticky top bar with role tabs. Cards only for queue items, forms and dialogs. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eaeeec; --fg:#14201c; --muted:#5b6b65; --line:#d6ddda;
  --accent:#0b6e5a; --accent-fg:#ffffff; --accent-soft:#dcefe9;
  --ok:#1a7f3c; --ok-soft:#e1f3e6; --warn:#a86200; --warn-soft:#fcefd9; --bad:#b42318; --bad-soft:#fde4e1;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1513; --surface:#161e1b; --sunk:#1d2723; --fg:#e7eeeb; --muted:#94a59e; --line:#2a3631;
  --accent:#3fbf9f; --accent-fg:#06231c; --accent-soft:#16352d;
  --ok:#5cc983; --ok-soft:#143322; --warn:#f0a53a; --warn-soft:#3a2a10; --bad:#f2786b; --bad-soft:#3d1a16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand span{color:var(--muted);font-size:12.5px}
.who{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}

main{padding:20px 24px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1440px;margin:0 auto}
.shell.no-side{grid-template-columns:minmax(0,1fr)}
.shell.no-side .side{display:none}
.side{position:sticky;top:var(--hdr-h,62px);align-self:start;height:calc(100vh - var(--hdr-h,62px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px 24px}

.side button:hover{background:var(--sunk)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;text-align:center}
#menuBtn{display:none}
.scrim{display:none}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.toolbar input[type=search]{max-width:280px;min-width:200px}
.spread .toolbar{flex:1;justify-content:flex-end;align-items:center}
table.fixed{table-layout:fixed}
.tbl thead th{position:sticky;top:0;z-index:1}
.lookup td{vertical-align:middle}
.lookup .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rate{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formfoot{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:-16px;background:var(--surface);padding:10px 0 2px;border-top:1px solid var(--line)}
.danger{border:1px solid var(--bad);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
label.check input{width:auto}
input,select,textarea{font:500 15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
td input{padding:6px 8px;font-size:14px;min-width:90px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted)}
.code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 7px;border-radius:6px;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.queue{display:flex;flex-direction:column;gap:10px}
.qitem{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);padding:14px}
.qitem .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 16px;font-size:13.5px;min-width:0}
.qitem .meta div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qitem img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.qactions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.paybox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:760px){.paybox{grid-template-columns:1fr}.qitem{grid-template-columns:1fr}}
.acct{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.acct b{display:block}
.qr{width:100%;max-width:260px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13.5px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font:600 13px var(--f-body);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.barrow .track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:999px}
.dues{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.due{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.due:last-child{border-bottom:0}
.due b.num{font-size:16px}
.login{max-width:420px;margin:8vh auto 0}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);max-width:min(760px,calc(100% - 32px));width:100%;padding:16px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{max-height:70vh;width:auto;display:block;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#printArea{display:none}
.print-head{display:none}
@media print{
  @page{margin:12mm}
  :root{color-scheme:light}
  body{background:#fff;color:#000;font-size:11pt;padding:0}
  header.top,.side,.scrim,.no-print,.btn,.seg,.toast,dialog,label input,label select,.toolbar{display:none!important}
  .shell{display:block} main{padding:0}
  .print-head{display:block;margin-bottom:8px}
  .tbl{overflow:visible;border-color:#999}
  table{font-size:9.5pt} th{background:#eee!important;color:#000} td,th{padding:5px 7px}
  .panel,.stat{border-color:#999;break-inside:avoid}
  tr{break-inside:avoid}
  body.print-area main{display:none!important}
  body.print-area #printArea{display:block}
}
</style>

  <div class="wrap">
    <div class="bar">
      <div class="row" style="flex-wrap:nowrap;gap:10px;min-width:0"><button class="btn sm" id="menuBtn" type="button" aria-label="Open menu">☰ Menu</button><div class="brand"><b id="coName">EHI Stall Rentals</b><span id="roleLine"></span></div></div>

<script>
/* ===== Connection (public keys, safe to ship in the page) ===== */
const SUPABASE_URL = "https://gzdwguuxjmdcpwejjiov.supabase.co";
const SUPABASE_KEY = "sb_publishable_WdGa89j8-2RAgkXBY8wKmQ_at8RpNt5";
const LOGIN_DOMAIN = "users.ehirent.example";

(() => {
const $ = s => document.querySelector(s);
const app = $("#app");
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

const CHANNELS = ["Cash","Check","GCash","Maya","InstaPay","Bank deposit"];
const CATS = { rent:"Rent", electricity:"Electricity", water:"Water", vat:"VAT", deposit:"Deposit", other:"Other charges" };
const PLAN = { daily:"Daily", weekly:"Weekly", monthly:"Monthly" };
const PLAN_UNIT = { daily:"day", weekly:"week", monthly:"month" };
const EXP_CATS = ["Repairs and maintenance","Salaries and wages","Security and janitorial","Supplies","Taxes and permits","Bank and e-wallet fees","Other"];
const ROLE_LABEL = { superadmin:"Superadmin", admin:"Admin", staff:"Staff", accounting:"Accounting", tenant:"Tenant" };
const NAV = [
  ["Overview",[["today","Dashboard"]]],
  ["Collections",[["verify","Verify payments"],["record","Record payment"],["deposits","Bank deposits"]]],
  ["Billing",[["billing","Water & light"],["charges","Charge history"],["invoices","VAT invoices"]]],
  ["Records",[["tenants","Tenants"],["expenses","Expenses"],["reports","Reports"]]],
  ["Admin",[["users","Logins"],["settings","Settings"]]],
  ["My stall",[["pay","Pay"],["statement","My statement"],["profile","My details"]]],
];
const ACCESS = {
  superadmin:["today","verify","record","deposits","billing","charges","invoices","tenants","expenses","reports","users","settings"],
  admin:["today","verify","record","deposits","billing","charges","invoices","tenants","expenses","reports","users","settings"],
  staff:["today","verify","record","deposits","billing","charges","tenants","reports"],
  accounting:["today","verify","deposits","charges","invoices","tenants","expenses","reports"],
  tenant:["pay","statement","profile"],
};
const TABS = Object.fromEntries(Object.entries(ACCESS).map(([r,keys])=>[r,NAV.flatMap(([,items])=>items).filter(([k])=>keys.includes(k))]));
const ONLINE = ["GCash","Maya","InstaPay","Bank deposit"];
const TEMP_PW = "2345678";
const S = { me:null, settings:{company:"Erica Holdings Inc.",accounts:[],electric_rate:0,water_rate:0}, tenants:{}, payments:[], charges:[], moves:[], expenses:[], invoices:[], bills:[], profiles:{}, tab:null, invMonth:null,
  rep:{mode:"monthly",date:null,from:null,to:null}, billMonth:null, expMonth:null, signed:{}, channel:null };

/* ===== helpers ===== */
const todayPH = () => new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
const nowLocalPH = () => new Date().toLocaleString("sv-SE",{timeZone:"Asia/Manila"}).slice(0,16).replace(" ","T");
const phDate = ts => ts ? new Date(ts).toLocaleDateString("en-CA",{timeZone:"Asia/Manila"}) : "";
const toISO = local => local ? new Date(local+":00+08:00").toISOString() : new Date().toISOString();
const addDays = (iso,n) => { const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const addMonths = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); const t=new Date(Date.UTC(y,m-1+n,1)); const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); t.setUTCDate(Math.min(d,last)); return t.toISOString().slice(0,10); };
const step = (plan, iso, n=1) => plan==="monthly" ? addMonths(iso,n) : addDays(iso, plan==="weekly"?7*n:n);
const fmtDate = iso => iso ? new Date(iso.slice(0,10)+"T00:00:00Z").toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}) : "";
const fmtDT = ts => ts ? new Date(ts).toLocaleString("en-PH",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",timeZone:"Asia/Manila"}) : "";
const fmtMonth = ym => ym ? new Date(ym+"-01T00:00:00Z").toLocaleDateString("en-PH",{month:"long",year:"numeric",timeZone:"UTC"}) : "";
const peso = n => "₱"+(Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const weekStart = iso => { const d=new Date(iso+"T00:00:00Z"); return addDays(iso,-((d.getUTCDay()+6)%7)); };
const monthStart = iso => iso.slice(0,8)+"01";
const monthEnd = iso => { const [y,m]=iso.split("-").map(Number); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); };
const cleanUser = u => String(u||"").trim().toLowerCase().replace(/\s+/g,".");
const suggestUser = name => cleanUser(String(name||"").replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean).slice(0,2).join(" "));
const tempPw = () => TEMP_PW;
const role = () => S.me && S.me.role;
const isOffice = () => ["superadmin","admin","staff","accounting"].includes(role());
const isSuper = () => role()==="superadmin";
const isManager = () => role()==="superadmin"||role()==="admin";
const canBill = () => ["superadmin","admin","staff"].includes(role());
const canExpense = () => ["superadmin","admin","accounting"].includes(role());
const canDeposit = () => ["superadmin","admin"].includes(role());
const rateText = t => `${peso(t.rate)} / ${PLAN_UNIT[t.plan]||"period"}`;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3000); }
function showDialog(html){ $("#dlgBody").innerHTML=html; if(!$("#dlg").open) $("#dlg").showModal(); }
function closeDialog(){ $("#dlg").close(); }
$("#dlgClose").onclick = closeDialog;
const errMsg = e => (e && (e.message || e.error_description || e.error)) || "Something went wrong. Try again.";

/* ===== auth ===== */
async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return viewLogin();
  await loadMe();
}
async function loadMe(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return viewLogin();
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(error || !data || !data.active){ await sb.auth.signOut(); return viewLogin("This login is not active. Contact the EHI superadmin."); }
  S.me = data;
  if(data.must_change_password) return viewChangePw(true);
  S.tab = TABS[data.role][0][0];
  const t=todayPH(); S.rep.date=t; S.rep.from=monthStart(t); S.rep.to=t; S.billMonth=t.slice(0,7); S.expMonth=t.slice(0,7); S.invMonth=t.slice(0,7);
  $("#hdr").hidden=false; $("#shell").classList.remove("no-side");
  $("#who").textContent = data.full_name;
  $("#roleLine").textContent = ROLE_LABEL[data.role] + " · @" + data.username;
  await loadAll();
  subscribe();
  draw();
}
function viewLogin(msg){
  $("#hdr").hidden=true; $("#shell").classList.add("no-side");
  app.innerHTML = `
  <section class="panel login">

const T = id => S.tenants[id] || {};
const tName = id => T(id).full_name || "Unknown";
const tStall = id => T(id).stall_no || "";
const tCode = id => T(id).code || "";

const paidAmt = p => p.status==="verified" ? Number(p.verified_amount ?? p.amount) : Number(p.amount);
const activeTenants = () => Object.values(S.tenants).filter(t=>t.active).sort((a,b)=>(a.stall_no||"").localeCompare(b.stall_no||"",undefined,{numeric:true}));

/* Period start dates of a tenant's rent plan from rent_start up to `upto` */
function periodStarts(t, upto){
  const out=[]; if(!t.rent_start) return out;
  const end = t.end_date && t.end_date<upto ? t.end_date : upto;
  let d=t.rent_start, i=0;
  while(d<=end && i<2000){ out.push(d); i++; d=step(t.plan,t.rent_start,i); }
  return out;
}
/* Date ranges covered by rent payments: [from, to) with status */
function rentRanges(tid){
  const t=T(tid); return S.payments.filter(p=>p.tenant_id===tid && p.category==="rent" && p.status!=="rejected" && p.cover_from)
    .map(p=>({from:p.cover_from, to:step(t.plan,p.cover_from,Math.max(1,p.periods||1)), status:p.status}));
}
function coverOf(tid){
  const rs=rentRanges(tid);
  return d => { let st=null; for(const r of rs){ if(d>=r.from && d<r.to){ if(r.status==="verified") return "verified"; st="pending"; } } return st; };
}
function rentStatus(tid, upto=todayPH()){
  const t=T(tid); const starts=periodStarts(t, upto); const cov=coverOf(tid);
  const unpaid=starts.filter(d=>!cov(d)); const checking=starts.filter(d=>cov(d)==="pending");
  return { starts, unpaid, checking, rate:Number(t.rate||0), amount:r2(unpaid.length*Number(t.rate||0)) };
}
function currentPeriod(tid, day=todayPH()){ const s=periodStarts(T(tid), day); return s.length?s[s.length-1]:null; }
function nextDue(tid){
  const t=T(tid); if(!t.rent_start) return todayPH(); const cov=coverOf(tid);
  let d=t.rent_start, i=0; while(cov(d) && i<2000){ i++; d=step(t.plan,t.rent_start,i); } return d;
}
/* Balance for charge-based categories */
function catBalance(tid, cat){
  const charged=S.charges.filter(c=>c.tenant_id===tid && c.kind===cat).reduce((s,c)=>s+Number(c.amount),0);
  const pays=S.payments.filter(p=>p.tenant_id===tid && p.category===cat);
  const ver=pays.filter(p=>p.status==="verified").reduce((s,p)=>s+paidAmt(p),0);
  const pen=pays.filter(p=>p.status==="pending").reduce((s,p)=>s+paidAmt(p),0);
  return { charged:r2(charged), paid:r2(ver), pending:r2(pen), due:r2(Math.max(0,charged-ver-pen)), overpaid:r2(Math.max(0,ver-charged)) };
}
function depositHeld(tid){
  const paid=S.payments.filter(p=>p.tenant_id===tid && p.category==="deposit" && p.status==="verified").reduce((s,p)=>s+paidAmt(p),0);
  const out=S.moves.filter(m=>m.tenant_id===tid).reduce((s,m)=>s+Number(m.amount),0);
  return r2(paid-out);
}
function tenantDue(tid){
  const rent=rentStatus(tid); const e=catBalance(tid,"electricity"), w=catBalance(tid,"water"), d=catBalance(tid,"deposit"), o=catBalance(tid,"other"), v=catBalance(tid,"vat");
  return { rent, e, w, d, o, v, total:r2(rent.amount+e.due+w.due+d.due+o.due+v.due) };
}
const statusPill = s => s==="verified"?'<span class="pill ok">Verified</span>':s==="rejected"?'<span class="pill bad">Rejected</span>':'<span class="pill warn">For checking</span>';
const rentPill = s => s==="verified"?'<span class="pill ok">Paid</span>':s==="pending"?'<span class="pill warn">Paid, checking</span>':'<span class="pill bad">Unpaid</span>';
const periodLabel = (t,d) => t.plan==="daily" ? fmtDate(d) : t.plan==="weekly" ? `Week of ${fmtDate(d)}` : `${fmtDate(d)} to ${fmtDate(addDays(addMonths(d,1),-1))}`;
const coverText = (p) => { if(p.category!=="rent"||!p.cover_from) return CATS[p.category]||p.category; const t=T(p.tenant_id); const n=p.periods||1; return `Rent, ${n} ${PLAN_UNIT[t.plan]||"period"}${n>1?"s":""} from ${fmtDate(p.cover_from)}`; };

function wirePayForm(office){
  const tidOf = () => office ? $("#pT").value : S.me.tenant_id;
  const sync = (resetAmt) => {
    const tid=tidOf(), t=T(tid), cat=$("#pCat").value, isRent=cat==="rent";
    app.querySelectorAll("[data-rent]").forEach(el=>el.hidden=!isRent);
    $("#pUnit").textContent = (PLAN_UNIT[t.plan]||"period")+"s";
    if(isRent){
      if(resetAmt || !$("#pFrom").value) $("#pFrom").value=nextDue(tid);
      const n=Math.max(1,Number($("#pPer").value)||1);
      if(resetAmt!==false) $("#pAmt").value=(Number(t.rate||0)*n).toFixed(2);
      $("#pHint").textContent = `${PLAN[t.plan]||""} rent ${rateText(t)}. Covers ${fmtDate($("#pFrom").value)} up to ${fmtDate(addDays(step(t.plan,$("#pFrom").value,n),-1))}.`;
    } else {
      const due = tenantDue(tid)[{electricity:"e",water:"w",deposit:"d",other:"o",vat:"v"}[cat]].due;
      if(resetAmt!==false) $("#pAmt").value = due ? due.toFixed(2) : "";
      $("#pHint").textContent = due ? `${CATS[cat]} balance: ${peso(due)}.` : `No ${CATS[cat].toLowerCase()} balance right now.`;
    }
  };
  const syncChan=()=>{ const ch=$("#pChan").value, isChk=ch==="Check", online=ONLINE.includes(ch);
    app.querySelectorAll("[data-check]").forEach(el=>el.hidden=!isChk); ["pChkNo","pChkBank"].forEach(id=>{ const el=document.getElementById(id); if(el) el.required=isChk; });
    $("#pRef").required=online; $("#pFile").required=online;
    $("#pRefL").textContent = online?"Reference number (required)":"Reference or OR number (optional)";
    $("#pFileL").textContent = online?"Proof of payment, receipt screenshot (required)":"Proof of payment (optional)"; };
  $("#pChan").onchange=syncChan; syncChan();
  $("#pCat").onchange=()=>sync(true);
  $("#pPer").oninput=()=>sync(true);
  $("#pFrom").onchange=()=>sync(false);
  if(office) $("#pT").onchange=()=>{ $("#pFrom").value=""; sync(true); };
  if(!(keep.fPay&&keep.fPay.pAmt)) sync(true); else sync(false);
  $("#fPay").onsubmit = e => savePayment(e, tidOf(), office);
}
async function savePayment(e, tid, office){
  e.preventDefault(); const btn=e.target.querySelector("button[type=submit]"); if(btn.disabled) return; const label=btn.textContent; btn.disabled=true; btn.textContent="Saving…";
  try{
    const cat=$("#pCat").value, chan=$("#pChan").value, online=ONLINE.includes(chan);
    if(online && !$("#pRef").value.trim()) throw new Error("Enter the reference number from the receipt.");
    if(online && !($("#pFile").files||[])[0]) throw new Error("Attach the receipt screenshot as proof of payment.");
    if(online){ const dup=S.payments.find(p=>p.channel===chan && p.status!=="rejected" && (p.ref_no||"").trim()===$("#pRef").value.trim()); if(dup) throw new Error(`This ${chan} reference number is already recorded for ${tName(dup.tenant_id)}.`); }
    let receipt_path=null; const f=$("#pFile");
    if(f && f.files[0]){ const file=f.files[0]; const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
      receipt_path=`${tid}/${crypto.randomUUID()}.${ext}`;
      const { error } = await sb.storage.from("receipts").upload(receipt_path, file, { contentType:file.type||"image/jpeg" });
      if(error){ receipt_path=null; if(online) throw new Error("The receipt did not upload. Check your connection and try again."); toast("Receipt upload failed. Saving without it."); } }
    const row={ tenant_id:tid, category:cat, amount:Number($("#pAmt").value), channel:chan, ref_no:$("#pRef").value.trim()||null,
      periods: cat==="rent"?Math.max(1,Number($("#pPer").value)||1):1, cover_from: cat==="rent"?($("#pFrom").value||nextDue(tid)):null,
      paid_at:toISO($("#pAt").value), note:$("#pNote").value.trim()||null, receipt_path };
    if(chan==="Check"){ row.check_no=$("#pChkNo").value.trim(); row.check_bank=$("#pChkBank").value.trim(); row.check_date=$("#pChkDate").value||null; }
    if(office && chan==="Cash") row.status="verified";
    const { error } = await sb.from("payments").insert(row);
    if(error) throw error;
    for(const k in keep) delete keep[k];
    toast(office?(chan==="Cash"?"Cash payment saved and verified":"Payment saved. It is in the Verify queue."):"Payment submitted. Status: for checking");
    await loadAll(); if(!office) S.tab="statement"; draw();
    if(office && chan==="Cash"){ const p=S.payments.filter(x=>x.tenant_id===tid).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""))[0]; if(p) sendDialog(tid,"Send payment confirmation","Payment received",paymentMessage(p)); }
  }catch(err){ toast(errMsg(err)); btn.disabled=false; btn.textContent=label; }
}

  const ch=S.charges.filter(c=>c.tenant_id===tid).sort((a,b)=>(b.bill_date||"").localeCompare(a.bill_date||""));
  const mv=S.moves.filter(m=>m.tenant_id===tid);
  const rs=rentStatus(tid); const cov=coverOf(tid);
  const recent=rs.starts.slice(-12).reverse();
  return `
  ${duesHTML(tid)}
  <section class="panel"><h3>Rent, last ${recent.length} ${PLAN_UNIT[t.plan]||"period"}s</h3>
    ${recent.length?`<div class="tbl"><table><thead><tr><th>Period</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
    ${recent.map(d=>`<tr><td>${periodLabel(t,d)}</td><td class="r num">${peso(t.rate)}</td><td>${rentPill(cov(d))}</td></tr>`).join("")}</tbody></table></div>`:`<div class="small muted">Rent starts on ${fmtDate(t.rent_start)}.</div>`}

  <section class="panel"><h3>Water, light, deposit, and other charges</h3>
    ${ch.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Charge</th><th>Details</th><th class="r">Amount</th></tr></thead><tbody>

    ${pays.length?`<div class="tbl"><table><thead><tr><th>Paid on</th><th>For</th><th>Mode</th><th>Reference</th><th class="r">Amount</th><th>Status</th>${isManager()?"<th></th>":""}</tr></thead><tbody>
    ${pays.slice().sort((a,b)=>b.paid_at.localeCompare(a.paid_at)).map(p=>`<tr><td>${fmtDT(p.paid_at)}</td><td class="small">${coverText(p)}</td><td>${esc(p.channel)}</td><td class="num">${esc(p.ref_no||"")}${p.receipt_path&&isOffice()?` <button class="btn sm" data-viewrc="${esc(p.receipt_path)}" type="button">Proof</button>`:""}</td><td class="r num">${peso(paidAmt(p))}</td><td>${statusPill(p.status)}${p.reject_reason?`<div class="small muted">${esc(p.reject_reason)}</div>`:""}</td>${isManager()?`<td><button class="btn sm bad" data-delpay="${p.id}" type="button">Delete</button></td>`:""}</tr>`).join("")}</tbody></table></div>`:`<div class="small muted">No payments yet.</div>`}
  </section>
  ${mv.length?`<section class="panel"><h3>Deposit refunds and forfeits</h3><div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th class="r">Amount</th><th>Note</th></tr></thead><tbody>
    ${mv.map(m=>`<tr><td>${fmtDate(m.moved_on)}</td><td>${m.kind==="refund"?"Refunded to tenant":"Forfeited to EHI"}</td><td class="r num">${peso(m.amount)}</td><td class="small">${esc(m.note)}</td></tr>`).join("")}</tbody></table></div></section>`:""}`;
}

  </section>`;
  const q=$("#dashQ"); if(q){ const run=()=>{ S.dashQ=q.value; const v=q.value.trim().toLowerCase(); app.querySelectorAll("#dashTbl tbody tr[data-q]").forEach(tr=>tr.hidden=!!v&&!tr.dataset.q.includes(v)); }; q.oninput=run; run(); }
  app.querySelectorAll("[data-dashf]").forEach(b=>b.onclick=()=>{ S.dashF=b.dataset.dashf; draw(); });

/* ===== Office: water & light billing ===== */
function lastReading(tid, kind, beforePeriod){
  const c=S.charges.filter(x=>x.tenant_id===tid && x.kind===kind && x.curr_reading!=null && x.period<beforePeriod).sort((a,b)=>b.period.localeCompare(a.period))[0];
  return c ? Number(c.curr_reading) : null;
}
const billOf = ym => S.bills.find(b=>String(b.month).slice(0,7)===ym) || null;
const ratesOf = ym => { const b=billOf(ym)||{}; return { er: Number(b.electric_kwh)>0 ? r2(b.electric_amount/b.electric_kwh*10000)/10000 : 0, wr: Number(b.water_m3)>0 ? r2(b.water_amount/b.water_m3*10000)/10000 : 0 }; };
function vBilling(){
  const m=S.billMonth; const ten=activeTenants(); const b=billOf(m)||{}; const {er,wr}=ratesOf(m);
  const existing=(tid,kind)=>S.charges.find(c=>c.tenant_id===tid && c.kind===kind && c.period===m);
  const billedE=S.charges.filter(c=>c.kind==="electricity"&&c.period===m).reduce((s,c)=>s+Number(c.amount),0);
  const billedW=S.charges.filter(c=>c.kind==="water"&&c.period===m).reduce((s,c)=>s+Number(c.amount),0);
  const cell=(t,kind)=>{
    const mode=t[kind==="electricity"?"electric_mode":"water_mode"]; const ex=existing(t.id,kind);
    if(mode==="none") return `<td colspan="3" class="small muted">Not billed</td>`;
    if(mode==="fixed"){ const amt=Number(t[kind==="electricity"?"electric_fixed":"water_fixed"]||0); return `<td colspan="2" class="small muted">Fixed monthly</td><td class="r num">${ex?`<span class="pill ok">Billed</span> ${peso(ex.amount)}`:peso(amt)}</td>`; }
    const prev = ex ? ex.prev_reading : lastReading(t.id,kind,m);
    return `<td><input type="number" step="0.01" min="0" id="pv-${kind[0]}-${t.id}" value="${prev??""}" placeholder="Previous" ${canBill()?"":"disabled"}></td><td><input type="number" step="0.01" min="0" id="cr-${kind[0]}-${t.id}" value="${ex?ex.curr_reading??"":""}" placeholder="Current" ${canBill()?"":"disabled"}></td><td class="r num" id="amt-${kind[0]}-${t.id}">${ex?`<span class="pill ok">Billed</span> ${peso(ex.amount)}`:"–"}</td>`;
  };
  app.innerHTML = `
  <div class="spread"><div><h1>Water & Light</h1><div class="small muted">Each stall pays its own usage at the rate from EHI's main bill. No VAT.</div></div>
    <label>Billing month<input type="month" id="bMonth" value="${m}"></label></div>
  <form class="panel" id="fMain" style="max-width:820px"><h3>Step 1. Main bills for ${fmtMonth(m)}</h3><div class="grid2">
    <label>Main electric bill (₱)<input id="mbEA" type="number" min="0" step="0.01" value="${b.electric_amount??""}"></label>
    <label>Total kWh on the bill<input id="mbEK" type="number" min="0" step="0.01" value="${b.electric_kwh??""}"></label>
    <label>Main water bill (₱)<input id="mbWA" type="number" min="0" step="0.01" value="${b.water_amount??""}"></label>
    <label>Total cubic meters on the bill<input id="mbWM" type="number" min="0" step="0.01" value="${b.water_m3??""}"></label></div>
    <div class="row"><button class="btn primary" type="submit">Save main bills</button><span class="small">Rate: <b class="num">${peso(er)}</b> per kWh · <b class="num">${peso(wr)}</b> per m³</span></div></form>
  <div class="stats">
    <div class="stat"><div class="k">Electricity billed to stalls</div><div class="v">${peso(billedE)}</div><div class="s">Main bill ${peso(b.electric_amount)}</div></div>
    <div class="stat ${Number(b.electric_amount||0)-billedE>0?"warn":""}"><div class="k">Common area electricity</div><div class="v">${peso(Number(b.electric_amount||0)-billedE)}</div><div class="s">EHI pays this</div></div>
    <div class="stat"><div class="k">Water billed to stalls</div><div class="v">${peso(billedW)}</div><div class="s">Main bill ${peso(b.water_amount)}</div></div>
    <div class="stat ${Number(b.water_amount||0)-billedW>0?"warn":""}"><div class="k">Common area water</div><div class="v">${peso(Number(b.water_amount||0)-billedW)}</div><div class="s">EHI pays this</div></div>
  </div>
  <h3>Step 2. Meter readings per stall</h3>
  ${!er||!wr?`<div class="note">Save the main bills first. The rates come from them.</div>`:""}
  ${ten.length?`<form id="fBill" class="tbl"><table><thead><tr><th>Stall</th><th>Electricity prev</th><th>Electricity now</th><th class="r">Electricity bill</th><th>Water prev</th><th>Water now</th><th class="r">Water bill</th></tr></thead><tbody>
  ${ten.map(t=>`<tr><td><span class="code">${esc(t.code)}</span><div>${esc(t.stall_no)} · ${esc(t.full_name)}</div></td>${cell(t,"electricity")}${cell(t,"water")}</tr>`).join("")}
  </tbody></table></form>
  ${canBill()?`<div class="row"><button class="btn primary" id="saveBill" type="button">Save ${fmtMonth(m)} stall bills</button><span class="small muted">Saving again replaces that month's bill for a stall.</span></div>`:""}`:`<div class="empty">No tenants yet.</div>`}
  ${canBill()?`<form class="panel" id="fOther" style="max-width:820px"><h3>Add another charge</h3><p class="small muted">For a one-time fee, penalty, or repair charged to a tenant.</p><div class="grid2">
    <label>Tenant<select id="oT">${ten.map(t=>`<option value="${t.id}">${esc(t.code)} · ${esc(t.full_name)}</option>`).join("")}</select></label>
    <label>Description<input id="oDesc" required placeholder="e.g. Late payment fee"></label>
    <label>Amount (₱)<input id="oAmt" type="number" min="1" step="0.01" required></label>
    <label>Date<input id="oDate" type="date" value="${todayPH()}"></label></div>
    <div><button class="btn" type="submit">Add charge</button></div></form>`:""}`;
  $("#bMonth").onchange=e=>{ if(e.target.value){ S.billMonth=e.target.value; for(const k in keep) delete keep[k]; draw(); } };
  $("#fMain").onsubmit=async e=>{ e.preventDefault();
    const row={month:m+"-01",electric_amount:Number($("#mbEA").value)||0,electric_kwh:Number($("#mbEK").value)||0,water_amount:Number($("#mbWA").value)||0,water_m3:Number($("#mbWM").value)||0,updated_at:new Date().toISOString()};
    const { error }=await sb.from("main_bills").upsert(row,{onConflict:"month"}); if(error) return toast(errMsg(error)); delete keep.fMain; toast("Main bills saved"); refresh(); };
  const calc=()=>ten.forEach(t=>{ [["e",er],["w",wr]].forEach(([k,rate])=>{ const pv=document.getElementById(`pv-${k}-${t.id}`), cr=document.getElementById(`cr-${k}-${t.id}`), out=document.getElementById(`amt-${k}-${t.id}`);
    if(!pv||!cr||cr.value==="") return; const use=Number(cr.value)-Number(pv.value||0); out.innerHTML = use<0?'<span class="pill bad">Check reading</span>':`<span class="small muted">${r2(use)} × </span>${peso(use*rate)}`; }); });
  app.querySelectorAll("#fBill input").forEach(i=>i.oninput=calc);
  const sb1=$("#saveBill"); if(sb1) sb1.onclick=async()=>{
    const rows=[]; const billDate=monthEnd(m+"-01")<todayPH()?monthEnd(m+"-01"):todayPH(); let bad=false, needRate=false;
    for(const t of ten){ for(const [k,kind,rate] of [["e","electricity",er],["w","water",wr]]){
      const mode=t[kind==="electricity"?"electric_mode":"water_mode"];
      if(mode==="fixed"){ const amt=Number(t[kind==="electricity"?"electric_fixed":"water_fixed"]||0); if(amt>0 && !existing(t.id,kind)) rows.push({tenant_id:t.id,kind,period:m,bill_date:billDate,amount:r2(amt),note:"Fixed monthly charge"}); continue; }
      if(mode!=="meter") continue;
      const pv=document.getElementById(`pv-${k}-${t.id}`), cr=document.getElementById(`cr-${k}-${t.id}`); if(!cr||cr.value==="") continue;
      if(!rate){ needRate=true; continue; }
      const prev=Number(pv.value||0), curr=Number(cr.value); if(curr<prev){ bad=true; continue; }
      rows.push({tenant_id:t.id,kind,period:m,bill_date:billDate,prev_reading:prev,curr_reading:curr,rate,amount:r2((curr-prev)*rate),note:null});
    } }
    if(needRate) return toast("Save the main bills for this month first, so the rate is known.");
    if(bad) return toast("A current reading is lower than the previous one. Fix the rows marked Check reading.");
    if(!rows.length) return toast("Enter at least one current reading.");
    sb1.disabled=true;

/* ===== Office: reports ===== */
function repRange(){ const r=S.rep, d=r.date;
  if(r.mode==="daily") return [d,d];
  if(r.mode==="weekly"){ const s=weekStart(d); return [s,addDays(s,6)]; }
  if(r.mode==="monthly") return [monthStart(d),monthEnd(d)];
  if(r.mode==="quarterly"){ const q=Math.floor((Number(d.slice(5,7))-1)/3); const s=`${d.slice(0,4)}-${String(q*3+1).padStart(2,"0")}-01`; return [s,monthEnd(addMonths(s,2))]; }
  if(r.mode==="yearly") return [`${d.slice(0,4)}-01-01`,`${d.slice(0,4)}-12-31`];
  return r.from<=r.to?[r.from,r.to]:[r.to,r.from]; }
/* All figures for a date range, accounting basis */
function periodFigures(from,to){
  const inR=x=>x>=from&&x<=to; const upto=to<todayPH()?to:todayPH();
  const ps=S.payments.filter(p=>inR(phDate(p.paid_at)));
  const ok=ps.filter(p=>p.status==="verified"), pen=ps.filter(p=>p.status==="pending");
  const sum=(a)=>a.reduce((s,p)=>s+paidAmt(p),0), cat=(a,c)=>a.filter(p=>p.category===c);
  const rentDue=Object.values(S.tenants).reduce((s,t)=>s+periodStarts(t,upto).filter(inR).length*Number(t.rate||0),0);
  const billed=k=>S.charges.filter(c=>c.kind===k&&inR(c.bill_date)).reduce((s,c)=>s+Number(c.amount),0);
  const inv=S.invoices.filter(i=>inR(i.issued_on));
  const bills=S.bills.filter(b=>inR(String(b.month).slice(0,10)));
  const exps=S.expenses.filter(x=>inR(x.spent_on));
  const forfeits=S.moves.filter(m=>m.kind==="forfeit"&&inR(m.moved_on)).reduce((s,m)=>s+Number(m.amount),0);
  const refunds=S.moves.filter(m=>m.kind==="refund"&&inR(m.moved_on)).reduce((s,m)=>s+Number(m.amount),0);
  const f={ ps, ok, pen, rentDue:r2(rentDue), rent:sum(cat(ok,"rent")), elec:sum(cat(ok,"electricity")), water:sum(cat(ok,"water")), other:sum(cat(ok,"other")),
    vatPaid:sum(cat(ok,"vat")), deposits:sum(cat(ok,"deposit")), pending:sum(pen), rentPending:sum(cat(pen,"rent")),
    elecBilled:billed("electricity"), waterBilled:billed("water"),
    invCount:inv.length, vatable:inv.reduce((s,i)=>s+Number(i.vatable),0), outVat:inv.reduce((s,i)=>s+Number(i.vat),0), invTotal:inv.reduce((s,i)=>s+Number(i.total),0),
    mainE:bills.reduce((s,b)=>s+Number(b.electric_amount),0), mainW:bills.reduce((s,b)=>s+Number(b.water_amount),0),
    other_exp:exps.reduce((s,x)=>s+Number(x.amount),0), exps, forfeits, refunds };
  f.gross=r2(f.rent+f.elec+f.water+f.other+f.forfeits);
  f.vatInside=r2(Math.max(0,f.outVat-f.vatPaid));
  f.expTotal=r2(f.mainE+f.mainW+f.other_exp);
  f.net=r2(f.gross-f.vatInside-f.expTotal);
  return f;
}
function vReports(){
  const r=S.rep; const [from,to]=repRange(); const F=periodFigures(from,to); const showExp=canExpense();
  const inRange=d=>d>=from&&d<=to; const upto=to<todayPH()?to:todayPH();
  const sum=a=>a.reduce((s,p)=>s+paidAmt(p),0);
  const rows=activeTenants().map(t=>{ const cov=coverOf(t.id); const st=periodStarts(t,upto).filter(inRange); const unpaid=st.filter(d=>!cov(d));
    return {t,periods:st.length,unpaid:unpaid.length,collected:sum(F.ok.filter(p=>p.tenant_id===t.id&&p.category!=="deposit")),pending:sum(F.pen.filter(p=>p.tenant_id===t.id)),d:tenantDue(t.id)}; });
  const months=[]; for(let m=monthStart(from); m<=to; m=addMonths(m,1)) months.push(m);
  const showMonths=months.length>1;
  const qOf=m=>Math.floor((Number(m.slice(5,7))-1)/3)+1;
  const mrow=(label,G,bold)=>`<tr${bold?' style="font-weight:700;background:var(--sunk)"':""}><td>${label}</td><td class="r num">${peso(G.rentDue)}</td><td class="r num">${peso(G.rent)}</td><td class="r num">${G.rentDue?Math.round(G.rent/G.rentDue*100)+"%":"–"}</td><td class="r num">${peso(G.elec+G.water)}</td><td class="r num">${peso(G.gross)}</td><td class="r num">${peso(G.outVat)}</td>${showExp?`<td class="r num">${peso(G.expTotal)}</td><td class="r num">${peso(G.net)}</td>`:""}</tr>`;
  let breakdown="";
  if(showMonths){ let html=""; let qStart=null;
    months.forEach((m,i)=>{ const G=periodFigures(m,monthEnd(m)<to?monthEnd(m):to); html+=mrow(fmtMonth(m.slice(0,7)),G);
      if(r.mode==="yearly" && (i===months.length-1 || qOf(months[i+1])!==qOf(m))){ const qs=`${m.slice(0,4)}-${String((qOf(m)-1)*3+1).padStart(2,"0")}-01`; html+=mrow(`Q${qOf(m)} total`,periodFigures(qs,monthEnd(m)),true); } });
    breakdown=`<section class="panel"><h3>By month${r.mode==="yearly"?" and quarter":""}</h3><div class="tbl"><table><thead><tr><th>Period</th><th class="r">Rent due</th><th class="r">Rent collected</th><th class="r">Rate</th><th class="r">Water & light collected</th><th class="r">Gross collected</th><th class="r">Output VAT</th>${showExp?`<th class="r">Expenses</th><th class="r">Net income</th>`:""}</tr></thead><tbody>${html}</tbody><tfoot>${mrow("Total",F,true).replace(/^<tr[^>]*>/,"<tr>")}</tfoot></table></div></section>`; }
  // collectors
  const coll={}; F.ps.filter(p=>p.status!=="rejected").forEach(p=>{ const pr=S.profiles[p.submitted_by]; const key=pr&&pr.role!=="tenant"?pr.full_name:"Tenant paid online";
    coll[key]=coll[key]||{n:0,amt:0,ver:0,pen:0,hand:0}; const c=coll[key]; c.n++; c.amt+=paidAmt(p); if(p.status==="verified") c.ver+=paidAmt(p); else c.pen+=paidAmt(p); if(isOnHand(p)) c.hand+=Number(p.amount); });
  const modes=CHANNELS.map(ch=>{ const a=F.ps.filter(p=>p.channel===ch&&p.status!=="rejected"); return {ch,n:a.length,amt:a.reduce((s,p)=>s+paidAmt(p),0),ver:a.filter(p=>p.status==="verified").reduce((s,p)=>s+paidAmt(p),0),dep:a.filter(p=>p.deposited_on).reduce((s,p)=>s+Number(p.amount),0),hand:a.filter(isOnHand).reduce((s,p)=>s+Number(p.amount),0)}; }).filter(x=>x.n);
  const collRows=Object.entries(coll).sort((a,b)=>b[1].amt-a[1].amt);
  const title = {daily:`Daily report, ${fmtDate(from)}`,weekly:`Weekly report, ${fmtDate(from)} to ${fmtDate(to)}`,monthly:`Monthly report, ${fmtMonth(from.slice(0,7))}`,quarterly:`Q${qOf(from)} ${from.slice(0,4)} report`,yearly:`Year ${from.slice(0,4)} report`,custom:`Report, ${fmtDate(from)} to ${fmtDate(to)}`}[r.mode];
  app.innerHTML = `
  <div class="spread">
    <div class="seg" role="group" aria-label="Report period">${["daily","weekly","monthly","quarterly","yearly","custom"].map(m=>`<button type="button" data-mode="${m}" aria-pressed="${r.mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>

const collectorOf = p => { const pr=S.profiles[p.submitted_by]; return pr&&pr.role!=="tenant" ? pr.full_name : "Tenant paid online"; };

function csv(name, rows){
  const text=rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function xlsx(name, sheets){
  if(!window.XLSX){ const first=Object.keys(sheets)[0]; return csv(name.replace(/\.xlsx$/,".csv"),sheets[first]); }
  const wb=XLSX.utils.book_new();
  for(const [n,rows] of Object.entries(sheets)){ const ws=XLSX.utils.aoa_to_sheet(rows);
    const w=[]; rows.forEach(r=>r.forEach((v,i)=>{ w[i]=Math.min(50,Math.max(w[i]||8,String(v??"").length+2)); })); ws["!cols"]=w.map(x=>({wch:x}));
    for(const k in ws){ if(k[0]!=="!" && typeof ws[k].v==="number" && !Number.isInteger(ws[k].v*1) ) ws[k].z="#,##0.00"; if(k[0]!=="!" && typeof ws[k].v==="number" && Math.abs(ws[k].v)>=100) ws[k].z="#,##0.00"; }
    XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31)); }
  XLSX.writeFile(wb,name);
}
function printStatement(tid){

  const done=()=>{ document.body.classList.remove("print-area"); pa.innerHTML=""; window.removeEventListener("afterprint",done); if(wasOpen) openStatement(tid); };

function statementMessage(tid){
  const t=T(tid), d=tenantDue(tid); const L=[];
  L.push(`Hi ${t.full_name||""}, here is your statement from ${S.settings.company||"EHI"} as of ${fmtDate(todayPH())}.`,``,`Tenant code: ${t.code}`,`Stall: ${t.stall_no}`,``);
  L.push(`Rent (${PLAN[t.plan]}): ${d.rent.unpaid.length?`${d.rent.unpaid.length} unpaid ${PLAN_UNIT[t.plan]}${d.rent.unpaid.length>1?"s":""}, ${peso(d.rent.amount)}`:"paid up"}`);
  L.push(`Electricity: ${peso(d.e.due)}`,`Water: ${peso(d.w.due)}`);
  if(d.v.charged) L.push(`VAT on invoices: ${peso(d.v.due)}`);
  if(d.d.charged) L.push(`Security deposit: ${peso(d.d.due)} due, ${peso(depositHeld(tid))} held`);
  if(d.o.charged) L.push(`Other charges: ${peso(d.o.due)}`);
  L.push(``,`Total balance: ${peso(d.total)}`);
  const recent=S.payments.filter(p=>p.tenant_id===tid&&p.status==="verified").sort((a,b)=>b.paid_at.localeCompare(a.paid_at)).slice(0,5);
  if(recent.length){ L.push(``,`Recent payments received:`); recent.forEach(p=>L.push(`- ${fmtDate(phDate(p.paid_at))}: ${peso(paidAmt(p))}, ${coverText(p)}`)); }
  L.push(``,`Please pay via GCash, Maya, or bank transfer and use your code ${t.code} as the reference. Thank you!`);
  return L.join("\n");
}
function statementCSV(tid){
  const t=T(tid); const cov=coverOf(tid); const rows=[];
  periodStarts(t,todayPH()).forEach(d=>rows.push([d,"Rent",periodLabel(t,d),t.rate,"",cov(d)||"unpaid"]));
  S.charges.filter(c=>c.tenant_id===tid).forEach(c=>rows.push([c.bill_date,CATS[c.kind],c.curr_reading!=null?`Reading ${c.prev_reading} to ${c.curr_reading}`:(c.note||""),c.amount,"",""]));
  S.payments.filter(p=>p.tenant_id===tid).forEach(p=>rows.push([phDate(p.paid_at),"Payment",`${coverText(p)} via ${p.channel} ref ${p.ref_no||""}`,"",paidAmt(p),p.status]));
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const d=tenantDue(tid);
  xlsx(`EHI-statement-${t.code}-${todayPH()}.xlsx`,{"Summary":[[S.settings.company||"EHI"],["Statement of account as of",todayPH()],["Tenant",t.full_name],["Code",t.code],["Stall",t.stall_no],[],["Rent due",d.rent.amount],["Electricity due",d.e.due],["Water due",d.w.due],["VAT due",d.v.due],["Deposit due",d.d.due],["Other due",d.o.due],["Total balance",d.total],["Deposit held",depositHeld(tid)]],"Ledger":[["Date","Type","Details","Charge","Payment","Status"]].concat(rows)});
}

    <label>Full name<input id="uName" required></label>
    <label>Username<input id="uUser" required autocapitalize="none"></label>
    <label>Role<select id="uRole">${(isSuper()?["staff","accounting","tenant","admin","superadmin"]:["staff","accounting","tenant"]).map(r=>`<option value="${r}">${ROLE_LABEL[r]}</option>`).join("")}</select></label>
    <label id="uTenantL" hidden>Tenant<select id="uTenant">${tenantOptions()}</select></label>
    <label>Temporary password (6+)<input id="uPass" required minlength="6" autocomplete="new-password"></label>
  </div><div><button class="btn primary" type="submit" id="uBtn">Create login</button></div></form>`);
  $("#uPass").value=tempPw();
  $("#uName").oninput=()=>{ if(!$("#uUser").dataset.touched) $("#uUser").value=suggestUser($("#uName").value); };
  $("#uUser").oninput=()=>$("#uUser").dataset.touched="1";
  $("#uRole").onchange=()=>{ $("#uTenantL").hidden=$("#uRole").value!=="tenant"; };
  $("#fU").onsubmit=async e=>{ e.preventDefault(); const btn=$("#uBtn"); if(btn.disabled) return; btn.disabled=true; btn.textContent="Saving…";
    const u=cleanUser($("#uUser").value), p=$("#uPass").value, name=$("#uName").value.trim(), r=$("#uRole").value;
    try{ await adminCall({action:"create",username:u,password:p,full_name:name,role:r,tenant_id:r==="tenant"?$("#uTenant").value:null});
      showDialog(`<h3>Login created</h3><p>Give these to ${esc(name)} (${ROLE_LABEL[r]}):</p><div class="panel" style="margin-top:10px"><div>Username <b class="num">${esc(u)}</b></div><div>Temporary password <b class="num">${esc(p)}</b></div></div><p class="small muted" style="margin-top:8px">This password shows once. They set a new one at first login.</p>`);
      await refresh();
    }catch(err){ $("#uErr").innerHTML=`<div class="err">${esc(errMsg(err))}</div>`; btn.disabled=false; btn.textContent="Create login"; } };
}

/* ===== Settings (superadmin and admin) ===== */
function vSettings(){
  const c=S.settings; const acc=(c.accounts&&c.accounts.length?c.accounts:[{channel:"GCash",name:"",number:""},{channel:"Maya",name:"",number:""},{channel:"Bank (InstaPay)",name:"",number:""}]);
  app.innerHTML = `<h1>Settings</h1>
  <form class="panel" id="fSet" style="max-width:780px"><div class="grid2">
    <label>Company name<input id="sCo" value="${esc(c.company)}"></label>
    <label>VAT rate (%)<input id="sVat" type="number" min="0" max="100" step="0.01" value="${Number(c.vat_rate??12)}"></label></div>
    <p class="small muted">Water and light rates come from each month's main bills, entered in Water & Light.</p>
    <h3>Where tenants send payment</h3>
    ${acc.map((a,i)=>`<div class="grid2"><label>Channel<input id="aC${i}" value="${esc(a.channel)}"></label><label>Account name<input id="aN${i}" value="${esc(a.name)}"></label><label>Number or account no.<input id="aU${i}" value="${esc(a.number)}"></label></div>`).join("")}
    <div><button class="btn primary" type="submit">Save settings</button></div></form>
  <section class="panel" style="max-width:780px"><h3>Payment QR code</h3><p class="small muted">Upload EHI's bank or QR Ph code. Tenants see it on their Pay screen.</p>
    ${qrUrl()?`<img class="qr" src="${esc(qrUrl())}" alt="Current QR code">`:""}
    <div class="row"><input id="qrFile" type="file" accept="image/*" style="max-width:320px"><button class="btn" id="qrUp" type="button">Upload QR</button></div></section>
  ${isSuper()?`<section class="danger" style="max-width:780px"><h3 style="color:var(--bad)">Clear test data</h3>
    <p class="small">Use this once before going live, to remove the records you entered for testing. This cannot be undone. Logins of staff, accounting, admin, and you stay.</p>
    <label class="check"><input type="radio" name="clr" value="transactions" checked> Delete all payments, charges, water and light bills, VAT invoices, deposits, and expenses. Keep the tenants.</label>
    <label class="check"><input type="radio" name="clr" value="everything"> Delete everything above, plus all tenants and their logins.</label>
    <label>Type DELETE to confirm<input id="clrTxt" autocomplete="off" style="max-width:220px"></label>
    <div><button class="btn bad" id="clrBtn" type="button">Clear test data</button></div>
    <p class="small muted">To remove one tenant or one payment only, open the tenant and use Delete.</p></section>`:""}`;
  restoreForms();
  $("#fSet").onsubmit=async e=>{ e.preventDefault();
    const accounts=acc.map((a,i)=>({channel:$("#aC"+i).value.trim(),name:$("#aN"+i).value.trim(),number:$("#aU"+i).value.trim()})).filter(a=>a.channel||a.name||a.number);
    const { error }=await sb.from("settings").update({company:$("#sCo").value.trim()||"EHI",vat_rate:Number($("#sVat").value)||0,accounts,updated_at:new Date().toISOString()}).eq("id",1);
    if(error) return toast(errMsg(error)); delete keep.fSet; await refresh(); toast("Settings saved"); };
  const cb=$("#clrBtn"); if(cb) cb.onclick=async()=>{ if($("#clrTxt").value.trim()!=="DELETE") return toast("Type DELETE in the box to confirm");
    const scope=(app.querySelector('input[name=clr]:checked')||{}).value; cb.disabled=true; cb.textContent="Clearing…";
    const { data, error }=await sb.rpc("clear_test_data",{p_scope:scope});
    if(error){ cb.disabled=false; cb.textContent="Clear test data"; return toast(errMsg(error)); }
    await removeFiles(data&&data.receipts); await refresh(); toast(`Cleared ${data.payments} payments${scope==="everything"?` and ${data.tenants} tenants`:""}`); };
  $("#qrUp").onclick=async()=>{ const f=$("#qrFile").files[0]; if(!f) return toast("Choose an image first");
    const path=`ehi-qr-${Date.now()}.${(f.name.split(".").pop()||"png").toLowerCase()}`;
    const up=await sb.storage.from("qr").upload(path,f,{contentType:f.type}); if(up.error) return toast(errMsg(up.error));
    const { error }=await sb.from("settings").update({qr_path:path}).eq("id",1); if(error) return toast(errMsg(error));
    await refresh(); toast("QR code updated"); };
}

/* ===== shared clicks (page and dialog) ===== */
async function onClick(e){
  const b=e.target.closest("button"); const img=e.target.closest("img[data-receipt]"); const tr=e.target.closest("tr[data-stmt]");
  if(img && img.src && !b){ showDialog(`<img src="${esc(img.src)}" alt="Receipt">`); return; }
  if(tr && !b){ openStatement(tr.dataset.stmt); return; }
  if(!b) return;
  if(b.dataset.go){ S.tab=b.dataset.go; draw(); return; }
  if(b.dataset.copy!==undefined){ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); }catch(err){ toast("Select the number to copy"); } return; }
  if(b.dataset.editT){ tenantForm(b.dataset.editT); return; }
  if(b.dataset.send){ const p=S.payments.find(x=>x.id===b.dataset.send); if(p) sendDialog(p.tenant_id,"Send payment confirmation","Payment received",paymentMessage(p)); return; }
  if(b.dataset.invsend){ const i=S.invoices.find(x=>x.id===b.dataset.invsend); if(i) sendDialog(i.tenant_id,"Send invoice details","VAT invoice "+(i.invoice_no||""),invoiceMessage(i),async via=>{ if(canExpense()) await sb.from("invoices").update({sent_via:via,sent_at:new Date().toISOString()}).eq("id",i.id); }); return; }
  if(b.dataset.delinv){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; return; }
    const { error }=await sb.from("invoices").delete().eq("id",b.dataset.delinv); if(error) return toast(errMsg(error)); toast("Invoice deleted"); refresh(); return; }
  if(b.dataset.depmove){ depositForm(b.dataset.depmove); return; }
  if(b.dataset.dlstmt){ statementCSV(b.dataset.dlstmt); return; }
  if(b.dataset.prstmt){ printStatement(b.dataset.prstmt); return; }
  if(b.dataset.undep){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to undo"; return; }
    const { error }=await sb.from("payments").update({deposited_on:null}).in("id",b.dataset.undep.split(",")); if(error) return toast(errMsg(error)); toast("Deposit undone. Items are back on hand."); refresh(); return; }
  if(b.dataset.sendstmt){ const tid=b.dataset.sendstmt; sendDialog(tid,"Send statement","Your statement of account",statementMessage(tid)); return; }
  if(b.dataset.recfor){ closeDialog(); S.recordFor=b.dataset.recfor; for(const k in keep) delete keep[k]; S.tab="record"; draw(); return; }
  if(b.dataset.viewrc){ const { data }=await sb.storage.from("receipts").createSignedUrl(b.dataset.viewrc,3600); if(data) showDialog(`<img src="${esc(data.signedUrl)}" alt="Receipt">`); return; }
  if(b.dataset.delx){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; return; }
    const { error }=await sb.from("expenses").delete().eq("id",b.dataset.delx); if(error) return toast(errMsg(error)); toast("Expense deleted"); refresh(); return; }
  if(b.dataset.ver || b.dataset.rej){
    const id=b.dataset.ver||b.dataset.rej; const reason=(document.getElementById("rej-"+id)||{}).value||"";
    if(b.dataset.rej && !reason.trim()) return toast("Type a reason before rejecting");
    b.disabled=true;
    const { error }=await sb.from("payments").update(b.dataset.rej?{status:"rejected",reject_reason:reason.trim()}:{status:"verified"}).eq("id",id);
    if(error){ b.disabled=false; return toast(errMsg(error)); }
    toast(b.dataset.rej?"Rejected":"Marked verified"); await refresh();
    if(b.dataset.ver){ const p=S.payments.find(x=>x.id===id); if(p) sendDialog(p.tenant_id,"Send payment confirmation","Payment received",paymentMessage(p)); }
    return;
  }
  if(b.dataset.undo){ const { error }=await sb.from("payments").update({status:"pending"}).eq("id",b.dataset.undo); if(error) return toast(errMsg(error)); toast("Moved back to checking"); refresh(); return; }
  if(b.dataset.reset){ pwForm(S.profiles[b.dataset.reset]); return; }
  if(b.dataset.dellogin){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; return; }
    try{ await adminCall({action:"delete_login",user_id:b.dataset.dellogin}); await refresh(); toast("Login deleted"); }catch(err){ toast(errMsg(err)); } return; }
  if(b.dataset.delpay){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; return; }
    const p=S.payments.find(x=>x.id===b.dataset.delpay); b.disabled=true;
    const { error }=await sb.from("payments").delete().eq("id",b.dataset.delpay); if(error){ b.disabled=false; return toast(errMsg(error)); }
    if(p&&p.receipt_path) await removeFiles([p.receipt_path]);
    const reopen=$("#dlg").open&&p; await refresh(); if(reopen) openStatement(p.tenant_id); toast("Payment deleted"); return; }
  if(b.dataset.delch){ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; return; }
    const { error }=await sb.from("charges").delete().eq("id",b.dataset.delch); if(error) return toast(errMsg(error)); await refresh(); toast("Charge deleted"); return; }
  if(b.dataset.delten){ const t=T(b.dataset.delten); const has=S.payments.some(p=>p.tenant_id===t.id)||S.invoices.some(i=>i.tenant_id===t.id)||S.moves.some(m=>m.tenant_id===t.id);
    if(has && !isSuper()) return toast("This tenant has payments or invoices. Mark it inactive in Edit tenant, or ask the superadmin to delete it.");
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent=has?"Deletes all its records. Tap again":"Tap again to delete"; return; }
    b.disabled=true; const { data, error }=await sb.rpc("delete_tenant",{p_tenant:t.id}); if(error){ b.disabled=false; return toast(errMsg(error)); }
    await removeFiles(data&&data.receipts); closeDialog(); await refresh(); toast(`${t.full_name} deleted`); return; }
  if(b.dataset.active){ const p=S.profiles[b.dataset.active];
    try{ await adminCall({action:"set_active",user_id:p.id,active:!p.active}); await refresh(); toast(p.active?"Login disabled":"Login enabled"); }catch(err){ toast(errMsg(err)); } return; }
  if(b.dataset.role){ const p=S.profiles[b.dataset.role];
    showDialog(`<form id="fR" class="panel" style="border:0;padding:0"><h3>Change role for ${esc(p.full_name)}</h3><div class="grid2">
      <label>Role<select id="rRole">${Object.entries(ROLE_LABEL).map(([k,l])=>`<option value="${k}" ${k===p.role?"selected":""}>${l}</option>`).join("")}</select></label>
      <label>Tenant (for tenant role)<select id="rTenant"><option value="">None</option>${tenantOptions(p.tenant_id)}</select></label></div>
      <div><button class="btn primary" type="submit">Save</button></div></form>`);
    $("#fR").onsubmit=async ev=>{ ev.preventDefault(); try{ await adminCall({action:"update",user_id:p.id,role:$("#rRole").value,tenant_id:$("#rTenant").value||null}); closeDialog(); await refresh(); toast("Role updated"); }catch(err){ toast(errMsg(err)); } };
  }
}
app.addEventListener("click", onClick);
$("#dlgBody").addEventListener("click", onClick);

start();
})();
</script>
